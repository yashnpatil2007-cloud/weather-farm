services:
  - type: web
    name: weather-farm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./farming.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: ALLOW_WEATHER_MOCK
        value: "true"
      - key: WEATHER_CACHE_SECONDS
        value: 900
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
